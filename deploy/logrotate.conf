# Log rotation for HN Showcase: PM2's logs for the site, the static server and
# the worker, and the cron logs in the repository's logs/ folder.
#
# Install it as root, because logrotate only reads rule files that belong to root:
#   sudo install -o root -g root -m 644 deploy/logrotate.conf /etc/logrotate.d/hnshowcase
# The system's daily logrotate run then applies it. To see what it would do
# without changing anything:
#   sudo logrotate -d /etc/logrotate.d/hnshowcase
#
# The paths and the user below are this server's; change them to match yours.
/home/shiwei/.pm2/logs/hn-*.log
/home/shiwei/showhn-src/logs/*.log
{
    # These folders belong to the app's user, so rotate as that user. Run as
    # root, logrotate refuses a folder that a group other than root's can write
    # to, or leaves root-owned copies in it.
    su shiwei shiwei

    # Once a month, or at the next daily run after a file passes 50 MB.
    monthly
    maxsize 50M

    # Keep 12 old copies, compressed, named by the date they were made.
    rotate 12
    dateext
    compress

    missingok
    notifempty

    # PM2 keeps each log open and cron appends to the same path, and nothing
    # tells either to reopen it. So copy the log and empty it in place instead
    # of renaming it. Both write in append mode, so the next line lands at the
    # start of the emptied file. A line written in the instant between the copy
    # and the emptying is lost.
    copytruncate
}
